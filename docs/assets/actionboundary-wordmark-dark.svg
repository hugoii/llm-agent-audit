<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 136" role="img" aria-labelledby="title desc">
  <title id="title">ActionBoundary dark wordmark</title>
  <desc id="desc">ActionBoundary wordmark for dark surfaces.</desc>
  <rect x="0" y="0" width="620" height="136" rx="8" fill="#10201f"/>
  <g transform="translate(26 24)">
    <rect x="0" y="0" width="88" height="88" rx="16" fill="#10201f"/>
    <rect x="0.5" y="0.5" width="87" height="87" rx="15.5" fill="none" stroke="#49b9a9" stroke-opacity="0.42"/>
    <text x="12" y="59" fill="#f5f7f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">A</text>
    <rect x="41.5" y="23" width="3" height="42" rx="1.5" fill="#9ad7cf"/>
    <text x="50" y="59" fill="#f5f7f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">B</text>
  </g>
  <rect x="142" y="34" width="1" height="68" fill="#49b9a9" opacity="0.32"/>
  <text x="172" y="62" fill="#f5f7f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0">ActionBoundary</text>
  <text x="174" y="90" fill="#aeb8c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0">Agent Authorization Review</text>
</svg>
