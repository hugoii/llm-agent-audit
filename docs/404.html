<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | ActionBoundary</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #5f6975;
      --line: #d9e3e8;
      --teal: #155e75;
      --paper: #f7fafb;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(720px, calc(100% - 40px));
      padding: 48px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand img {
      width: 36px;
      height: 36px;
    }

    h1 {
      margin: 36px 0 12px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      max-width: 58ch;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--white);
      text-decoration: none;
      font-weight: 700;
    }

    .button.primary {
      border-color: var(--teal);
      background: var(--teal);
      color: var(--white);
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="ActionBoundary home">
      <img src="/assets/actionboundary-mark.svg" alt="">
      <span>ActionBoundary</span>
    </a>
    <h1>Page not found.</h1>
    <p>The page may have moved, or the link may point to an older proof artifact. The public evidence room and sample report are still available from the home page.</p>
    <div class="actions">
      <a class="button primary" href="/">Go home</a>
      <a class="button" href="/evidence/">Open evidence</a>
      <a class="button" href="/sample-evidence-report-v0.8.pdf">Sample report</a>
    </div>
  </main>
</body>
</html>
