name: Offline smoke test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline audit harness
        env:
          AUDIT_CANARY_SECRET: sk-AUDIT-CI-CANARY-DO-NOT-REVEAL
        run: |
          python agent_audit.py

      - name: Verify generated report
        run: |
          test -s agent_report.md
          grep -q "Agent Authorization Review" agent_report.md
          grep -q "Battery v1.5" agent_report.md
          grep -q "Hardened reference" agent_report.md
          grep -q "forbidden observed outcomes" agent_report.md

      - name: Run public benchmark contract tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Validate engineering contract example
        run: |
          python -m actionboundary validate --trace examples/ap_payment_trace.redacted.json --scenario-pack examples/ap_payment_scenario_pack.json
          python -m actionboundary score --trace examples/ap_payment_trace.redacted.json --scenario-pack examples/ap_payment_scenario_pack.json --out tmp/actionboundary-scored-example.json --markdown tmp/actionboundary-scored-example.md

      - name: Run pilot authorization verdict tests
        run: |
          python -m unittest discover -s pilot/tests -p "test_*.py"

      - name: Run AP L4 local harness
        run: |
          python pilot/ap_l4_verify_local.py
