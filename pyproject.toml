[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actionboundary"
version = "0.1.0"
description = "Agent authorization review tooling for trace-backed high-impact action evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "JZ Software Consulting" }
]
dependencies = [
  "jsonschema>=4.22"
]

[project.optional-dependencies]
dev = [
  "black>=24",
  "pypdf>=4.3",
  "pytest>=8",
  "reportlab>=4.2",
  "ruff>=0.8"
]

[project.scripts]
actionboundary = "actionboundary.cli:main"

[tool.setuptools.packages.find]
include = ["actionboundary*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pilot/tests"]
norecursedirs = ["private", "tmp", ".venv*"]
